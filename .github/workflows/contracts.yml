name: contracts

on:
  push:
    branches: [main]
    paths: ["contracts/**", ".github/workflows/contracts.yml", ".gitmodules"]
  pull_request:
    paths: ["contracts/**", ".github/workflows/contracts.yml", ".gitmodules"]

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Format check
        run: forge fmt --check

      - name: Build with size report
        run: forge build --sizes

      - name: Tests
        run: forge test -vvv

      - name: Coverage
        run: forge coverage --report summary

      - name: Gas snapshot check
        run: forge snapshot --check --tolerance 5
 